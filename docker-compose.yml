x-agentg-module-environment: &agentg-module-environment
  DATABASE_URL: postgres://agentg:agentg@postgres:5432/agentg
  MODULE_RPC_HOST: 0.0.0.0
  MODULE_RPC_PORT: 8080
  NATS_URL: nats://nats:4222
  REGISTRY_URL: http://registry:8080

x-agentg-module-service: &agentg-module-service
  build:
    context: .
    target: runtime
  depends_on:
    nats:
      condition: service_started
    postgres:
      condition: service_healthy
  restart: 'no'

services:
  telegram:
    profiles:
      - container-client
    build:
      context: .
      target: runtime
    depends_on:
      registry:
        condition: service_started
      nats:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://agentg:agentg@postgres:5432/agentg
      NATS_URL: nats://nats:4222
      REGISTRY_URL: http://registry:8080
      HOST: 0.0.0.0
      PORT: 8080
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TDLIB_DATABASE_DIR: /app/td-data/database
      TDLIB_FILES_DIR: /app/td-data/files
    volumes:
      - ./td-data:/app/td-data
    restart: 'no'
    command: ['npm', 'run', 'dev:telegram']

  modulesmoke:
    profiles:
      - module-smoke
    <<: *agentg-module-service
    command:
      [
        'node',
        '-e',
        "console.log(JSON.stringify({event:'module.smoke.ready',slug:process.env.MODULE_SLUG,rpcUrl:process.env.MODULE_RPC_URL,natsUrl:process.env.NATS_URL,databaseUrl:process.env.DATABASE_URL})); setInterval(() => {}, 1000)"
      ]
    environment:
      <<: *agentg-module-environment
      MODULE_MIGRATION_FOLDER: packages/modulesmoke/drizzle
      MODULE_RPC_URL: http://modulesmoke:8080
      MODULE_SLUG: modulesmoke
      MODULE_TABLE_PREFIX: modulesmoke_

  registry:
    profiles:
      - registry
      - container-client
      - control-plane
    build:
      context: .
      target: runtime
    command: ['npm', '--workspace', '@agentg/registry', 'run', 'dev']
    depends_on:
      nats:
        condition: service_started
    environment:
      NATS_URL: nats://nats:4222
      HOST: 0.0.0.0
      PORT: 8080
    restart: 'no'

  control-plane:
    profiles:
      - control-plane
    build:
      context: .
      target: runtime
    command: ['npm', '--workspace', '@agentg/control-plane', 'run', 'start']
    depends_on:
      registry:
        condition: service_started
      nats:
        condition: service_started
    environment:
      DATABASE_URL: postgres://agentg:agentg@postgres:5432/agentg
      CONTROL_PLANE_HOST: 0.0.0.0
      CONTROL_PLANE_PORT: ${CONTROL_PLANE_PORT:-8788}
      CONTROL_PLANE_URL: http://control-plane:${CONTROL_PLANE_PORT:-8788}
      NATS_URL: nats://nats:4222
      REGISTRY_URL: http://registry:8080
      TDLIB_FILES_DIR: /app/td-data/files
    ports:
      - '${CONTROL_PLANE_PORT:-8788}:${CONTROL_PLANE_PORT:-8788}'
    restart: 'no'

  history-sync:
    profiles:
      - container-client
      - control-plane
    build:
      context: .
      target: runtime
    command: ['npm', '--workspace', '@agentg/history-sync', 'run', 'dev']
    depends_on:
      registry:
        condition: service_started
      nats:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://agentg:agentg@postgres:5432/agentg
      NATS_URL: nats://nats:4222
      REGISTRY_URL: http://registry:8080
      HOST: 0.0.0.0
      PORT: 8080
    restart: 'no'

  gateway:
    profiles:
      - container-client
      - control-plane
    build:
      context: .
      target: runtime
    command: ['npm', '--workspace', '@agentg/gateway', 'run', 'dev']
    depends_on:
      registry:
        condition: service_started
      nats:
        condition: service_started
    environment:
      NATS_URL: nats://nats:4222
      REGISTRY_URL: http://registry:8080
      HOST: 0.0.0.0
      PORT: 8080
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: ${GATEWAY_PORT:-8787}
    ports:
      - '${GATEWAY_PORT:-8787}:${GATEWAY_PORT:-8787}'
    restart: 'no'

  nats:
    image: nats:2.12-alpine
    ports:
      - '4222:4222'

  postgres:
    image: postgres:18-alpine
    command: ['postgres', '-c', 'shared_preload_libraries=pg_stat_statements']
    environment:
      POSTGRES_DB: agentg
      POSTGRES_USER: agentg
      POSTGRES_PASSWORD: agentg
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agentg -d agentg']
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
