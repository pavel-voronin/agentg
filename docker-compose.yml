x-agentg-telemetry-environment: &agentg-telemetry-environment
  AGENTG_TELEMETRY: ${AGENTG_TELEMETRY:-0}
  OTEL_BLRP_SCHEDULE_DELAY: ${OTEL_BLRP_SCHEDULE_DELAY:-1000}
  OTEL_BSP_SCHEDULE_DELAY: ${OTEL_BSP_SCHEDULE_DELAY:-1000}
  OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://otel-collector:4318/v1/logs
  OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://otel-collector:4318/v1/metrics
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
  OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-1000}
  GRAFANA_URL: http://127.0.0.1:3000
  JAEGER_UI_URL: http://127.0.0.1:16686
  VICTORIA_METRICS_URL: http://127.0.0.1:8428

x-agentg-module-environment: &agentg-module-environment
  <<: *agentg-telemetry-environment
  DATABASE_URL: postgres://agentg:agentg@postgres:5432/agentg
  MODULE_RPC_HOST: 0.0.0.0
  MODULE_RPC_PORT: 8080
  NATS_URL: nats://nats:4222

x-agentg-module-service: &agentg-module-service
  build:
    context: .
    target: runtime
  depends_on:
    nats:
      condition: service_started
    postgres:
      condition: service_healthy
  restart: 'no'

x-agentg-rpc-healthcheck: &agentg-rpc-healthcheck
  test:
    [
      'CMD',
      'node',
      '--input-type=module',
      '--eval',
      "const response = await fetch('http://127.0.0.1:8080/rpc', { body: JSON.stringify({ procedure: '__healthcheck__' }), headers: { 'content-type': 'application/json' }, method: 'POST' }); if (response.status !== 404) process.exit(1);"
    ]
  interval: 2s
  timeout: 3s
  retries: 60
  start_period: 5s

services:
  policies:
    profiles:
      - container-client
      - dashboard
    build:
      context: .
      target: runtime
    command: ['npm', 'run', 'dev:policies']
    depends_on:
      nats:
        condition: service_started
    environment:
      <<: *agentg-telemetry-environment
      NATS_URL: nats://nats:4222
      POLICY_CONFIG_DIR: /app/config/policies
      HOST: 0.0.0.0
      PORT: 8080
    volumes:
      - ./config/policies:/app/config/policies
    restart: 'no'
    healthcheck: *agentg-rpc-healthcheck

  telegram:
    profiles:
      - container-client
      - dashboard
    build:
      context: .
      target: runtime
    depends_on:
      nats:
        condition: service_started
      policies:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      <<: *agentg-telemetry-environment
      DATABASE_URL: postgres://agentg:agentg@postgres:5432/agentg
      NATS_URL: nats://nats:4222
      POLICIES_RPC_URL: http://policies:8080
      HOST: 0.0.0.0
      PORT: 8080
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TDLIB_DATABASE_DIR: /app/td-data/database
      TDLIB_FILES_DIR: /app/td-data/files
    volumes:
      - ./td-data:/app/td-data
    restart: 'no'
    command: ['npm', 'run', 'dev:telegram']
    healthcheck: *agentg-rpc-healthcheck

  llm-runner:
    profiles:
      - container-client
      - dashboard
    build:
      context: .
      target: runtime
    depends_on:
      nats:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      <<: *agentg-telemetry-environment
      DATABASE_URL: postgres://agentg:agentg@postgres:5432/agentg
      NATS_URL: nats://nats:4222
      HOST: 0.0.0.0
      PORT: 8080
      LLM_RUNNER_PROFILES_PATH: /app/config/llm-runner/profiles.yaml
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    restart: 'no'
    command: ['npm', 'run', 'dev:llm-runner']
    healthcheck: *agentg-rpc-healthcheck

  data:
    profiles:
      - container-client
      - dashboard
    build:
      context: .
      target: runtime
    depends_on:
      nats:
        condition: service_started
      postgres:
        condition: service_healthy
      telegram:
        condition: service_healthy
    environment:
      <<: *agentg-telemetry-environment
      DATA_PROVIDER_TARGETS: '{"telegram":"http://telegram:8080"}'
      DATABASE_URL: postgres://agentg:agentg@postgres:5432/agentg
      NATS_URL: nats://nats:4222
      HOST: 0.0.0.0
      PORT: 8080
    restart: 'no'
    command: ['npm', 'run', 'dev:data']
    healthcheck: *agentg-rpc-healthcheck

  pipelines:
    profiles:
      - container-client
      - dashboard
    build:
      context: .
      target: runtime
    depends_on:
      data:
        condition: service_healthy
      llm-runner:
        condition: service_healthy
      nats:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      <<: *agentg-telemetry-environment
      DATABASE_URL: postgres://agentg:agentg@postgres:5432/agentg
      NATS_URL: nats://nats:4222
      PIPELINES_ACTION_TARGETS: '{"data":"http://data:8080","llm-runner":"http://llm-runner:8080"}'
      TRIGGERS_RPC_URL: http://triggers:8080
      HOST: 0.0.0.0
      PORT: 8080
    restart: 'no'
    command: ['npm', 'run', 'dev:pipelines']
    healthcheck: *agentg-rpc-healthcheck

  triggers:
    profiles:
      - container-client
      - dashboard
    build:
      context: .
      target: runtime
    depends_on:
      pipelines:
        condition: service_healthy
      nats:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      <<: *agentg-telemetry-environment
      DATABASE_URL: postgres://agentg:agentg@postgres:5432/agentg
      NATS_URL: nats://nats:4222
      TRIGGERS_ACTION_TARGETS: '{"pipelines":"http://pipelines:8080"}'
      HOST: 0.0.0.0
      PORT: 8080
    restart: 'no'
    command: ['npm', 'run', 'dev:triggers']
    healthcheck: *agentg-rpc-healthcheck

  modulesmoke:
    profiles:
      - module-smoke
    <<: *agentg-module-service
    command:
      [
        'npx',
        'tsx',
        '-e',
        "import { createLogger, startTelemetryRuntime } from '@agentg/framework'; const serviceName = process.env.MODULE_SLUG || 'modulesmoke'; const stopTelemetry = startTelemetryRuntime(serviceName); const logger = createLogger(serviceName); logger.info({event:'module.smoke.ready',slug:process.env.MODULE_SLUG,rpcUrl:process.env.MODULE_RPC_URL,natsUrl:process.env.NATS_URL,databaseUrl:process.env.DATABASE_URL}, 'module smoke ready'); const shutdown = async () => { await stopTelemetry(); process.exit(0); }; process.once('SIGTERM', shutdown); process.once('SIGINT', shutdown); setInterval(() => {}, 1000)"
      ]
    environment:
      <<: *agentg-module-environment
      MODULE_MIGRATION_FOLDER: packages/modulesmoke/drizzle
      MODULE_RPC_URL: http://modulesmoke:8080
      MODULE_SLUG: modulesmoke
      MODULE_TABLE_PREFIX: modulesmoke_

  dashboard:
    profiles:
      - dashboard
    build:
      context: .
      target: runtime
    command: ['npm', '--workspace', '@agentg/dashboard', 'run', 'start']
    depends_on:
      nats:
        condition: service_started
      postgres:
        condition: service_healthy
      triggers:
        condition: service_healthy
    environment:
      <<: *agentg-telemetry-environment
      DATABASE_URL: postgres://agentg:agentg@postgres:5432/agentg
      DASHBOARD_HOST: 0.0.0.0
      DASHBOARD_PORT: 8080
      NATS_URL: nats://nats:4222
      TELEGRAM_RPC_URL: http://telegram:8080
    restart: 'no'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '--input-type=module',
          '--eval',
          "const response = await fetch('http://127.0.0.1:8080/healthz'); if (response.status !== 200) process.exit(1);"
        ]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 5s

  dashboard-edge:
    profiles:
      - dashboard
    image: nginx:1.29-alpine
    depends_on:
      dashboard:
        condition: service_healthy
      telegram-files:
        condition: service_started
    ports:
      - '${DASHBOARD_PORT:-8788}:8080'
    volumes:
      - ./infra/dashboard-edge/dashboardEdge.config:/etc/nginx/conf.d/default.conf:ro
    restart: 'no'

  gateway:
    profiles:
      - container-client
      - dashboard
    build:
      context: .
      target: runtime
    command: ['npm', '--workspace', '@agentg/gateway', 'run', 'dev']
    depends_on:
      data:
        condition: service_healthy
      nats:
        condition: service_started
      pipelines:
        condition: service_healthy
      policies:
        condition: service_healthy
      telegram:
        condition: service_healthy
      triggers:
        condition: service_healthy
    environment:
      <<: *agentg-telemetry-environment
      DATA_RPC_URL: http://data:8080
      NATS_URL: nats://nats:4222
      PIPELINES_RPC_URL: http://pipelines:8080
      TELEGRAM_RPC_URL: http://telegram:8080
      POLICIES_RPC_URL: http://policies:8080
      HOST: 0.0.0.0
      PORT: 8080
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: ${GATEWAY_PORT:-8787}
    ports:
      - '${GATEWAY_PORT:-8787}:${GATEWAY_PORT:-8787}'
    restart: 'no'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '--input-type=module',
          '--eval',
          "const port = process.env.GATEWAY_PORT ?? '8787'; const response = await fetch('http://127.0.0.1:' + port); if (response.status !== 404) process.exit(1);"
        ]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 5s

  telegram-files:
    image: nginx:1.29-alpine
    ports:
      - '${TELEGRAM_FILES_PORT:-8790}:8080'
    volumes:
      - ./td-data/files:/srv/tdlib-files:ro
      - ./infra/file-server/fileServer.config:/etc/nginx/conf.d/default.conf:ro
    restart: 'no'

  nats:
    image: nats:2.12-alpine
    command: ['-m', '8222']
    ports:
      - '4222:4222'
      - '8222:8222'

  nats-exporter:
    profiles:
      - telemetry
    image: natsio/prometheus-nats-exporter:0.17.3
    entrypoint: ['sh', '-c']
    command:
      - >
        telemetry="$$(printf "%s" "$${AGENTG_TELEMETRY:-0}" | tr "[:upper:]" "[:lower:]")";
        case "$$telemetry" in
          ""|0|false|no|off)
            echo "NATS metrics disabled";
            while :; do sleep 3600; done
            ;;
          *)
            exec /prometheus-nats-exporter -varz -connz_detailed -subz -healthz http://nats:8222
            ;;
        esac
    environment:
      AGENTG_TELEMETRY: ${AGENTG_TELEMETRY:-0}
    depends_on:
      nats:
        condition: service_started
    restart: 'no'

  postgres-extensions:
    profiles:
      - telemetry
    image: postgres:18-alpine
    command:
      [
        'psql',
        'postgres://agentg:agentg@postgres:5432/agentg',
        '-v',
        'ON_ERROR_STOP=1',
        '-c',
        'CREATE EXTENSION IF NOT EXISTS pg_stat_statements'
      ]
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  postgres-exporter:
    profiles:
      - telemetry
    image: quay.io/prometheuscommunity/postgres-exporter:v0.19.1
    command:
      - '--collector.database_wraparound'
      - '--collector.long_running_transactions'
      - '--no-collector.replication_slot'
      - '--no-collector.roles'
      - '--collector.postmaster'
      - '--collector.stat_activity_autovacuum'
      - '--collector.stat_checkpointer'
      - '--no-collector.stat_progress_vacuum'
      - '--collector.stat_statements'
      - '--collector.stat_statements.limit=100'
      - '--collector.statio_user_indexes'
      - '--disable-settings-metrics'
    environment:
      DATA_SOURCE_NAME: postgresql://agentg:agentg@postgres:5432/agentg?sslmode=disable
      PG_EXPORTER_COLLECTION_TIMEOUT: 10s
    depends_on:
      postgres-extensions:
        condition: service_completed_successfully
    restart: 'no'

  otel-collector:
    profiles:
      - telemetry
    image: otel/opentelemetry-collector:0.153.0
    command: ['--config=/etc/otel-collector/collectorConfig.yml']
    depends_on:
      loki:
        condition: service_started
      victoria-metrics:
        condition: service_started
      jaeger:
        condition: service_started
    ports:
      - '4317:4317'
      - '4318:4318'
    volumes:
      - ./observability/otel-collector/collectorConfig.yml:/etc/otel-collector/collectorConfig.yml:ro

  loki:
    profiles:
      - telemetry
    image: grafana/loki:3.6.0
    command: ['-config.file=/etc/loki/lokiConfig.yml']
    ports:
      - '3100:3100'
    tmpfs:
      - /loki:uid=10001,gid=10001
    volumes:
      - ./observability/loki/lokiConfig.yml:/etc/loki/lokiConfig.yml:ro

  victoria-metrics:
    profiles:
      - telemetry
    image: victoriametrics/victoria-metrics:v1.144.0
    command:
      - '-opentelemetry.usePrometheusNaming'
      - '-promscrape.config=/etc/victoria-metrics/scrapeConfig.yml'
      - '-search.latencyOffset=1s'
    tmpfs:
      - /victoria-metrics-data
    ports:
      - '8428:8428'
    volumes:
      - ./observability/victoria-metrics/scrapeConfig.yml:/etc/victoria-metrics/scrapeConfig.yml:ro

  jaeger:
    profiles:
      - telemetry
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.19.0
    command:
      - '--set=extensions.jaeger_query.ui.config_file=/jaeger/uiConfig.json'
    ports:
      - '16686:16686'
      - '5778:5778'
      - '9411:9411'
    volumes:
      - ./observability/jaeger/uiConfig.json:/jaeger/uiConfig.json:ro

  grafana:
    profiles:
      - telemetry
    image: grafana/grafana:13.0.2
    depends_on:
      jaeger:
        condition: service_started
      loki:
        condition: service_started
      victoria-metrics:
        condition: service_started
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 1s
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: 'false'
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
      GF_SECURITY_ALLOW_EMBEDDING: 'true'
      GF_USERS_DEFAULT_THEME: light
    ports:
      - '3000:3000'
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro

  postgres:
    image: postgres:18-alpine
    command: ['postgres', '-c', 'shared_preload_libraries=pg_stat_statements']
    environment:
      POSTGRES_DB: agentg
      POSTGRES_USER: agentg
      POSTGRES_PASSWORD: agentg
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agentg -d agentg']
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
