x-agentg-telemetry-environment: &agentg-telemetry-environment
  AGENTG_TELEMETRY: ${AGENTG_TELEMETRY:-0}
  OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://otel-collector:4318/v1/logs
  OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://otel-collector:4318/v1/metrics
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
  GRAFANA_URL: http://127.0.0.1:3000
  JAEGER_UI_URL: http://127.0.0.1:16686
  VICTORIA_METRICS_URL: http://127.0.0.1:8428

x-agentg-module-environment: &agentg-module-environment
  <<: *agentg-telemetry-environment
  DATABASE_URL: postgres://agentg:agentg@postgres:5432/agentg
  MODULE_RPC_HOST: 0.0.0.0
  MODULE_RPC_PORT: 8080
  NATS_URL: nats://nats:4222
  REGISTRY_URL: http://registry:8080

x-agentg-module-service: &agentg-module-service
  build:
    context: .
    target: runtime
  depends_on:
    nats:
      condition: service_started
    postgres:
      condition: service_healthy
  restart: 'no'

services:
  telegram:
    profiles:
      - container-client
    build:
      context: .
      target: runtime
    depends_on:
      registry:
        condition: service_started
      nats:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      <<: *agentg-telemetry-environment
      DATABASE_URL: postgres://agentg:agentg@postgres:5432/agentg
      NATS_URL: nats://nats:4222
      REGISTRY_URL: http://registry:8080
      HOST: 0.0.0.0
      PORT: 8080
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TDLIB_DATABASE_DIR: /app/td-data/database
      TDLIB_FILES_DIR: /app/td-data/files
    volumes:
      - ./td-data:/app/td-data
    restart: 'no'
    command: ['npm', 'run', 'dev:telegram']

  modulesmoke:
    profiles:
      - module-smoke
    <<: *agentg-module-service
    command:
      [
        'npx',
        'tsx',
        '-e',
        "import { createLogger, startTelemetryRuntime } from '@agentg/framework'; const serviceName = process.env.MODULE_SLUG || 'modulesmoke'; const stopTelemetry = startTelemetryRuntime(serviceName); const logger = createLogger(serviceName); logger.info({event:'module.smoke.ready',slug:process.env.MODULE_SLUG,rpcUrl:process.env.MODULE_RPC_URL,natsUrl:process.env.NATS_URL,databaseUrl:process.env.DATABASE_URL}, 'module smoke ready'); const shutdown = async () => { await stopTelemetry(); process.exit(0); }; process.once('SIGTERM', shutdown); process.once('SIGINT', shutdown); setInterval(() => {}, 1000)"
      ]
    environment:
      <<: *agentg-module-environment
      MODULE_MIGRATION_FOLDER: packages/modulesmoke/drizzle
      MODULE_RPC_URL: http://modulesmoke:8080
      MODULE_SLUG: modulesmoke
      MODULE_TABLE_PREFIX: modulesmoke_

  registry:
    profiles:
      - registry
      - container-client
      - control-plane
    build:
      context: .
      target: runtime
    command: ['npm', '--workspace', '@agentg/registry', 'run', 'dev']
    depends_on:
      nats:
        condition: service_started
    environment:
      <<: *agentg-telemetry-environment
      NATS_URL: nats://nats:4222
      HOST: 0.0.0.0
      PORT: 8080
    restart: 'no'

  control-plane:
    profiles:
      - control-plane
    build:
      context: .
      target: runtime
    command: ['npm', '--workspace', '@agentg/control-plane', 'run', 'start']
    depends_on:
      registry:
        condition: service_started
      nats:
        condition: service_started
    environment:
      <<: *agentg-telemetry-environment
      DATABASE_URL: postgres://agentg:agentg@postgres:5432/agentg
      CONTROL_PLANE_HOST: 0.0.0.0
      CONTROL_PLANE_PORT: ${CONTROL_PLANE_PORT:-8788}
      CONTROL_PLANE_URL: http://control-plane:${CONTROL_PLANE_PORT:-8788}
      NATS_URL: nats://nats:4222
      REGISTRY_URL: http://registry:8080
      TDLIB_FILES_DIR: /app/td-data/files
    ports:
      - '${CONTROL_PLANE_PORT:-8788}:${CONTROL_PLANE_PORT:-8788}'
    restart: 'no'

  history-sync:
    profiles:
      - container-client
      - control-plane
    build:
      context: .
      target: runtime
    command: ['npm', '--workspace', '@agentg/history-sync', 'run', 'dev']
    depends_on:
      registry:
        condition: service_started
      nats:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      <<: *agentg-telemetry-environment
      DATABASE_URL: postgres://agentg:agentg@postgres:5432/agentg
      NATS_URL: nats://nats:4222
      REGISTRY_URL: http://registry:8080
      HOST: 0.0.0.0
      PORT: 8080
    restart: 'no'

  gateway:
    profiles:
      - container-client
      - control-plane
    build:
      context: .
      target: runtime
    command: ['npm', '--workspace', '@agentg/gateway', 'run', 'dev']
    depends_on:
      registry:
        condition: service_started
      nats:
        condition: service_started
    environment:
      <<: *agentg-telemetry-environment
      NATS_URL: nats://nats:4222
      REGISTRY_URL: http://registry:8080
      HOST: 0.0.0.0
      PORT: 8080
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: ${GATEWAY_PORT:-8787}
    ports:
      - '${GATEWAY_PORT:-8787}:${GATEWAY_PORT:-8787}'
    restart: 'no'

  nats:
    image: nats:2.12-alpine
    command: ['-m', '8222']
    ports:
      - '4222:4222'
      - '8222:8222'

  nats-exporter:
    profiles:
      - telemetry
    image: natsio/prometheus-nats-exporter:0.17.3
    entrypoint: ['sh', '-c']
    command:
      - >
        telemetry="$$(printf "%s" "$${AGENTG_TELEMETRY:-0}" | tr "[:upper:]" "[:lower:]")";
        case "$$telemetry" in
          ""|0|false|no|off)
            echo "NATS metrics disabled";
            while :; do sleep 3600; done
            ;;
          *)
            exec /prometheus-nats-exporter -varz -connz_detailed -subz -healthz http://nats:8222
            ;;
        esac
    environment:
      AGENTG_TELEMETRY: ${AGENTG_TELEMETRY:-0}
    depends_on:
      nats:
        condition: service_started
    restart: 'no'

  postgres-extensions:
    profiles:
      - telemetry
    image: postgres:18-alpine
    command:
      [
        'psql',
        'postgres://agentg:agentg@postgres:5432/agentg',
        '-v',
        'ON_ERROR_STOP=1',
        '-c',
        'CREATE EXTENSION IF NOT EXISTS pg_stat_statements'
      ]
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  postgres-exporter:
    profiles:
      - telemetry
    image: quay.io/prometheuscommunity/postgres-exporter:v0.19.1
    command:
      - '--collector.database_wraparound'
      - '--collector.long_running_transactions'
      - '--no-collector.replication_slot'
      - '--no-collector.roles'
      - '--collector.postmaster'
      - '--collector.stat_activity_autovacuum'
      - '--collector.stat_checkpointer'
      - '--no-collector.stat_progress_vacuum'
      - '--collector.stat_statements'
      - '--collector.stat_statements.limit=100'
      - '--collector.statio_user_indexes'
      - '--disable-settings-metrics'
    environment:
      DATA_SOURCE_NAME: postgresql://agentg:agentg@postgres:5432/agentg?sslmode=disable
      PG_EXPORTER_COLLECTION_TIMEOUT: 10s
    depends_on:
      postgres-extensions:
        condition: service_completed_successfully
    restart: 'no'

  otel-collector:
    profiles:
      - telemetry
    image: otel/opentelemetry-collector:0.153.0
    command: ['--config=/etc/otel-collector/collectorConfig.yml']
    depends_on:
      loki:
        condition: service_started
      victoria-metrics:
        condition: service_started
      jaeger:
        condition: service_started
    ports:
      - '4317:4317'
      - '4318:4318'
    volumes:
      - ./observability/otel-collector/collectorConfig.yml:/etc/otel-collector/collectorConfig.yml:ro

  loki:
    profiles:
      - telemetry
    image: grafana/loki:3.6.0
    command: ['-config.file=/etc/loki/lokiConfig.yml']
    ports:
      - '3100:3100'
    tmpfs:
      - /loki:uid=10001,gid=10001
    volumes:
      - ./observability/loki/lokiConfig.yml:/etc/loki/lokiConfig.yml:ro

  victoria-metrics:
    profiles:
      - telemetry
    image: victoriametrics/victoria-metrics:v1.144.0
    command:
      - '-opentelemetry.usePrometheusNaming'
      - '-promscrape.config=/etc/victoria-metrics/scrapeConfig.yml'
    tmpfs:
      - /victoria-metrics-data
    ports:
      - '8428:8428'
    volumes:
      - ./observability/victoria-metrics/scrapeConfig.yml:/etc/victoria-metrics/scrapeConfig.yml:ro

  jaeger:
    profiles:
      - telemetry
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.19.0
    command:
      - '--set=extensions.jaeger_query.ui.config_file=/jaeger/uiConfig.json'
    ports:
      - '16686:16686'
      - '5778:5778'
      - '9411:9411'
    volumes:
      - ./observability/jaeger/uiConfig.json:/jaeger/uiConfig.json:ro

  grafana:
    profiles:
      - telemetry
    image: grafana/grafana:13.0.2
    depends_on:
      jaeger:
        condition: service_started
      loki:
        condition: service_started
      victoria-metrics:
        condition: service_started
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: 'false'
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
      GF_SECURITY_ALLOW_EMBEDDING: 'true'
      GF_USERS_DEFAULT_THEME: light
    ports:
      - '3000:3000'
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro

  postgres:
    image: postgres:18-alpine
    command: ['postgres', '-c', 'shared_preload_libraries=pg_stat_statements']
    environment:
      POSTGRES_DB: agentg
      POSTGRES_USER: agentg
      POSTGRES_PASSWORD: agentg
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agentg -d agentg']
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
