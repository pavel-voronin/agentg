x-agentg-module-environment: &agentg-module-environment
  DATABASE_URL: postgres://agentg:agentg@postgres:5432/agentg
  MODULE_RPC_HOST: 0.0.0.0
  MODULE_RPC_PORT: 8080
  NATS_URL: nats://nats:4222
  SERVICE_DIRECTORY_RPC_URL: http://service-directory:8080

x-agentg-module-service: &agentg-module-service
  build:
    context: .
    target: runtime
  depends_on:
    nats:
      condition: service_started
    postgres:
      condition: service_healthy
  restart: 'no'

services:
  telegram:
    profiles:
      - container-client
    build:
      context: .
      target: runtime
    depends_on:
      service-directory:
        condition: service_started
      nats:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://agentg:agentg@postgres:5432/agentg
      NATS_URL: nats://nats:4222
      SERVICE_DIRECTORY_RPC_URL: http://service-directory:8080
      TELEGRAM_RPC_HOST: 0.0.0.0
      TELEGRAM_RPC_PORT: 8080
      TELEGRAM_RPC_URL: http://telegram:8080
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TDLIB_DATABASE_DIR: /app/td-data/database
      TDLIB_FILES_DIR: /app/td-data/files
    volumes:
      - ./td-data:/app/td-data
    restart: 'no'
    command: ['npm', '--workspace', '@agentg/telegram', 'run', 'start']

  modulesmoke:
    profiles:
      - module-smoke
    <<: *agentg-module-service
    command:
      [
        'node',
        '-e',
        "console.log(JSON.stringify({event:'module.smoke.ready',slug:process.env.MODULE_SLUG,rpcUrl:process.env.MODULE_RPC_URL,natsUrl:process.env.NATS_URL,databaseUrl:process.env.DATABASE_URL})); setInterval(() => {}, 1000)"
      ]
    environment:
      <<: *agentg-module-environment
      MODULE_MIGRATION_FOLDER: packages/modulesmoke/drizzle
      MODULE_RPC_URL: http://modulesmoke:8080
      MODULE_SLUG: modulesmoke
      MODULE_TABLE_PREFIX: modulesmoke_

  service-directory:
    profiles:
      - service-directory
      - container-client
      - history-sync
      - gateway
      - control-plane
    build:
      context: .
      target: runtime
    command: ['npm', '--workspace', '@agentg/service-directory', 'run', 'start']
    depends_on:
      nats:
        condition: service_started
    environment:
      NATS_URL: nats://nats:4222
      SERVICE_DIRECTORY_RPC_HOST: 0.0.0.0
      SERVICE_DIRECTORY_RPC_PORT: 8080
    restart: 'no'

  gateway:
    profiles:
      - gateway
    build:
      context: .
      target: runtime
    command: ['npm', '--workspace', '@agentg/gateway', 'run', 'start']
    depends_on:
      service-directory:
        condition: service_started
      nats:
        condition: service_started
    environment:
      AGENT_GATEWAY_HOST: 0.0.0.0
      AGENT_GATEWAY_PORT: ${AGENT_GATEWAY_PORT:-8787}
      AGENT_GATEWAY_TOKEN: ${AGENT_GATEWAY_TOKEN:-}
      AGENT_GATEWAY_URL: http://gateway:${AGENT_GATEWAY_PORT:-8787}
      NATS_URL: nats://nats:4222
      SERVICE_DIRECTORY_RPC_URL: http://service-directory:8080
    ports:
      - '${AGENT_GATEWAY_PORT:-8787}:${AGENT_GATEWAY_PORT:-8787}'
    restart: 'no'

  control-plane:
    profiles:
      - control-plane
    build:
      context: .
      target: runtime
    command: ['npm', '--workspace', '@agentg/control-plane', 'run', 'start']
    depends_on:
      service-directory:
        condition: service_started
      history-sync:
        condition: service_started
      nats:
        condition: service_started
    environment:
      CONTROL_PLANE_HOST: 0.0.0.0
      CONTROL_PLANE_PORT: ${CONTROL_PLANE_PORT:-8788}
      CONTROL_PLANE_URL: http://control-plane:${CONTROL_PLANE_PORT:-8788}
      NATS_URL: nats://nats:4222
      SERVICE_DIRECTORY_RPC_URL: http://service-directory:8080
    ports:
      - '${CONTROL_PLANE_PORT:-8788}:${CONTROL_PLANE_PORT:-8788}'
    restart: 'no'

  history-sync:
    profiles:
      - history-sync
    build:
      context: .
      target: runtime
    command: ['npm', '--workspace', '@agentg/history-sync', 'run', 'start']
    depends_on:
      service-directory:
        condition: service_started
      nats:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://agentg:agentg@postgres:5432/agentg
      HISTORY_SYNC_CHAT_LOAD_BATCH_SIZE: ${HISTORY_SYNC_CHAT_LOAD_BATCH_SIZE:-100}
      HISTORY_SYNC_MESSAGE_LIMIT: ${HISTORY_SYNC_MESSAGE_LIMIT:-100}
      HISTORY_SYNC_REQUEST_DELAY_MS: ${HISTORY_SYNC_REQUEST_DELAY_MS:-1000}
      HISTORY_SYNC_WINDOW_DAYS: ${HISTORY_SYNC_WINDOW_DAYS:-31}
      HISTORY_SYNC_RPC_HOST: 0.0.0.0
      HISTORY_SYNC_RPC_PORT: 8080
      HISTORY_SYNC_RPC_URL: http://history-sync:8080
      NATS_URL: nats://nats:4222
      SERVICE_DIRECTORY_RPC_URL: http://service-directory:8080
    restart: 'no'

  nats:
    image: nats:2.12-alpine
    ports:
      - '4222:4222'

  postgres:
    image: postgres:18-alpine
    command: ['postgres', '-c', 'shared_preload_libraries=pg_stat_statements']
    environment:
      POSTGRES_DB: agentg
      POSTGRES_USER: agentg
      POSTGRES_PASSWORD: agentg
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agentg -d agentg']
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
