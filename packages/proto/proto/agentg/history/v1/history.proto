syntax = "proto3";

package agentg.history.v1;

service HistoryService {
  rpc GetOverview(HistoryGetOverviewRequest) returns (HistoryOverviewResponse);
  rpc ListChats(HistoryListChatsRequest) returns (HistoryListChatsResponse);
  rpc GetChatHistoryState(HistoryGetChatHistoryStateRequest) returns (HistoryChatHistoryStateResponse);
  rpc UpsertTarget(HistoryUpsertTargetRequest) returns (HistoryTargetMutationResponse);
  rpc DeleteTarget(HistoryDeleteTargetRequest) returns (HistoryTargetMutationResponse);
  rpc RequestSync(HistoryRequestSyncRequest) returns (HistoryRequestSyncResponse);
  rpc ListJobs(HistoryListJobsRequest) returns (HistoryListJobsResponse);
}

message HistoryGetOverviewRequest {}

message HistoryOverviewResponse {
  uint32 chats = 1;
  uint32 templates = 2;
  uint32 targets = 3;
  uint32 coverage_intervals = 4;
  uint32 pending_jobs = 5;
  uint32 running_jobs = 6;
  HistoryActiveJob active_job = 7;
}

message HistoryActiveJob {
  string chat_id = 1;
  string start_at = 2;
  string end_at = 3;
  string status = 4;
}

enum HistoryChatListKind {
  HISTORY_CHAT_LIST_KIND_UNSPECIFIED = 0;
  HISTORY_CHAT_LIST_KIND_MAIN = 1;
  HISTORY_CHAT_LIST_KIND_ARCHIVE = 2;
  HISTORY_CHAT_LIST_KIND_FOLDER = 3;
}

message HistoryListChatsRequest {
  string query = 1;
  string type = 2;
  uint32 limit = 3;
  HistoryChatListKind list = 4;
  uint32 folder_id = 5;
}

message HistoryListChatsResponse {
  repeated HistoryChat chats = 1;
  HistoryChatNavigation navigation = 2;
  repeated HistoryChatTypeCount types = 3;
}

message HistoryChat {
  string id = 1;
  string title = 2;
  string type = 3;
  bool is_bot = 4;
  uint32 coverage_intervals = 5;
  string coverage_newest_at = 6;
  string coverage_oldest_at = 7;
  uint32 pending_jobs = 8;
  uint32 running_jobs = 9;
  uint32 targets = 10;
  string updated_at = 11;
}

message HistoryChatNavigation {
  uint32 main_count = 1;
  uint32 archive_count = 2;
  repeated HistoryChatFolder folders = 3;
}

message HistoryChatFolder {
  uint32 id = 1;
  string title = 2;
  uint32 count = 3;
  string icon_name = 4;
  uint32 position = 5;
}

message HistoryChatTypeCount {
  string type = 1;
  uint32 count = 2;
}

message HistoryGetChatHistoryStateRequest {
  string chat_id = 1;
}

message HistoryChatHistoryStateResponse {
  HistorySelectedChat chat = 1;
  repeated HistoryInterval coverage = 2;
  repeated HistoryInterval desired = 3;
  repeated HistoryJob jobs = 4;
  repeated HistoryInterval missing = 5;
  repeated HistoryTarget targets = 6;
}

message HistorySelectedChat {
  string id = 1;
  string title = 2;
  string type = 3;
  bool is_bot = 4;
  uint32 message_count = 5;
  string updated_at = 6;
  bool history_beginning_reached = 7;
  string history_start_at = 8;
}

message HistoryInterval {
  string start_at = 1;
  string end_at = 2;
  uint32 message_count = 3;
}

message HistoryTarget {
  string id = 1;
  string chat_id = 2;
  HistoryRange range = 3;
  string template_id = 4;
  HistoryInterval projected = 5;
}

message HistoryStoredTarget {
  string id = 1;
  string chat_id = 2;
  HistoryRange range = 3;
  string template_id = 4;
}

message HistoryRange {
  HistoryBoundary start = 1;
  HistoryBoundary end = 2;
}

message HistoryBoundary {
  string kind = 1;
  string at = 2;
  string expression = 3;
}

message HistoryJob {
  string id = 1;
  string chat_id = 2;
  string start_at = 3;
  string end_at = 4;
  string status = 5;
  string updated_at = 6;
  string cursor_json = 7;
}

message HistoryUpsertTargetRequest {
  string chat_id = 1;
  string target_id = 2;
  string preset = 3;
  string start = 4;
  string end = 5;
  HistoryRange range = 6;
}

message HistoryDeleteTargetRequest {
  string target_id = 1;
}

message HistoryTargetMutationResponse {
  bool upserted = 1;
  bool deleted = 2;
  HistoryStoredTarget target = 3;
}

message HistoryRequestSyncRequest {
  string chat_id = 1;
}

message HistoryRequestSyncResponse {
  bool requested = 1;
}

message HistoryListJobsRequest {
  string status = 1;
  uint32 limit = 2;
}

message HistoryListJobsResponse {
  repeated HistoryJob jobs = 1;
}
