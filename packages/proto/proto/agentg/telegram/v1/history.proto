syntax = "proto3";

package agentg.telegram.v1;

service TelegramHistoryService {
  rpc ListChats(TelegramHistoryListChatsRequest) returns (TelegramHistoryListChatsResponse);
  rpc FetchPage(TelegramHistoryFetchPageRequest) returns (TelegramHistoryFetchPageResponse);
}

message TelegramHistoryListChatsRequest {
  bool discover = 1;
  uint32 load_batch_size = 2;
}

message TelegramHistoryListChatsResponse {
  repeated TelegramHistoryChat chats = 1;
}

message TelegramHistoryChat {
  string id = 1;
  string title = 2;
  string type = 3;
}

message TelegramHistoryFetchPageRequest {
  string chat_id = 1;
  string start_at = 2;
  string end_at = 3;
  uint32 limit = 4;
  string cursor_message_id = 5;
}

enum TelegramHistoryFetchPageKind {
  TELEGRAM_HISTORY_FETCH_PAGE_KIND_UNSPECIFIED = 0;
  TELEGRAM_HISTORY_FETCH_PAGE_KIND_NO_MESSAGES_BEFORE_END = 1;
  TELEGRAM_HISTORY_FETCH_PAGE_KIND_ANCHOR_BEFORE_START = 2;
  TELEGRAM_HISTORY_FETCH_PAGE_KIND_PAGE = 3;
}

message TelegramHistoryFetchPageResponse {
  TelegramHistoryFetchPageKind kind = 1;
  uint32 fetched_messages = 2;
  uint32 stored_messages = 3;
  string anchor_message_date = 4;
  bool crossed_start = 5;
  string next_cursor_message_id = 6;
  string oldest_fetched_message_date = 7;
  bool reached_beginning = 8;
}
