apiVersion: 1

datasources:
  - name: VictoriaMetrics
    type: prometheus
    uid: victoria-metrics
    access: proxy
    url: http://victoria-metrics:8428
    isDefault: true
    jsonData:
      exemplarTraceIdDestinations:
        - datasourceUid: jaeger
          name: traceID
  - name: Jaeger
    type: jaeger
    uid: jaeger
    access: proxy
    url: http://jaeger:16686
    jsonData:
      nodeGraph:
        enabled: true
      traceIdTimeParams:
        enabled: true
      tracesToLogsV2:
        datasourceUid: loki
        filterBySpanID: false
        filterByTraceID: false
        customQuery: true
        spanStartTimeShift: '-2m'
        spanEndTimeShift: '2m'
        tags:
          - key: service.name
            value: service_name
        query: '{$${__tags}} |= "$${__trace.traceId}"'
      tracesToMetrics:
        datasourceUid: victoria-metrics
        spanStartTimeShift: '-2m'
        spanEndTimeShift: '2m'
        tags:
          - key: service.name
            value: service_name
          - key: rpc.method
            value: rpc_method
          - key: rpc.service
            value: rpc_service
          - key: rpc.system.name
            value: rpc_system_name
          - key: db.system.name
            value: db_system_name
          - key: db.operation.name
            value: db_operation_name
          - key: db.query.summary
            value: db_query_summary
          - key: messaging.system
            value: messaging_system
          - key: messaging.destination.name
            value: messaging_destination_name
          - key: messaging.operation.type
            value: messaging_operation_type
          - key: telegram.update.type
            value: telegram_update_type
          - key: telegram.get_messages.stage
            value: telegram_get_messages_stage
          - key: telegram.message_view.stage
            value: telegram_message_view_stage
          - key: telegram.file.record.stage
            value: telegram_file_record_stage
        queries:
          - name: RPC server rate
            query: 'sum(rate(rpc_server_call_duration_seconds_count{$$__tags}[5m]))'
          - name: RPC server p95
            query: 'histogram_quantile(0.95, sum by (le) (rate(rpc_server_call_duration_seconds_bucket{$$__tags}[5m])))'
          - name: RPC client rate
            query: 'sum(rate(rpc_client_call_duration_seconds_count{$$__tags}[5m]))'
          - name: RPC client p95
            query: 'histogram_quantile(0.95, sum by (le) (rate(rpc_client_call_duration_seconds_bucket{$$__tags}[5m])))'
          - name: DB p95
            query: 'histogram_quantile(0.95, sum by (le) (rate(db_client_operation_duration_seconds_bucket{$$__tags}[5m])))'
          - name: Telegram update p95
            query: 'histogram_quantile(0.95, sum by (le) (rate(telegram_update_processing_duration_seconds_bucket{$$__tags}[5m])))'
          - name: Telegram get messages stage p95
            query: 'histogram_quantile(0.95, sum by (le) (rate(telegram_get_messages_stage_duration_seconds_bucket{$$__tags}[5m])))'
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        - datasourceUid: jaeger
          matcherRegex: '"trace_id":"([0-9a-f]{32})"'
          name: TraceID
          url: '$${__value.raw}'
      maxLines: 1000
