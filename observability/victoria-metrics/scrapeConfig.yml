global:
  scrape_interval: 1s

scrape_configs:
  - job_name: nats
    static_configs:
      - targets:
          - nats-exporter:7777
        labels:
          service: nats
  - job_name: postgres
    static_configs:
      - targets:
          - postgres-exporter:9187
        labels:
          service: postgres
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'pg_up|pg_database_connection_limit|pg_database_size_bytes|pg_database_wraparound_age_datfrozenxid_seconds|pg_database_wraparound_age_datminmxid_seconds|pg_locks_count|pg_long_running_transactions|pg_long_running_transactions_oldest_timestamp_seconds|pg_postmaster_start_time_seconds|pg_replication_is_replica|pg_replication_lag_seconds|pg_replication_last_replay_seconds|pg_stat_activity_autovacuum_timestamp_seconds|pg_stat_activity_count|pg_stat_activity_max_tx_duration|pg_stat_archiver_archived_count|pg_stat_archiver_failed_count|pg_stat_bgwriter_buffers_alloc_total|pg_stat_bgwriter_buffers_clean_total|pg_stat_bgwriter_maxwritten_clean_total|pg_stat_checkpointer_buffers_written_total|pg_stat_checkpointer_num_requested_total|pg_stat_checkpointer_num_timed_total|pg_stat_checkpointer_restartpoints_done_total|pg_stat_checkpointer_restartpoints_req_total|pg_stat_checkpointer_restartpoints_timed_total|pg_stat_checkpointer_sync_time_total|pg_stat_checkpointer_write_time_total|pg_stat_database_blk_read_time|pg_stat_database_blk_write_time|pg_stat_database_blks_hit|pg_stat_database_blks_read|pg_stat_database_deadlocks|pg_stat_database_temp_bytes|pg_stat_database_temp_files|pg_stat_database_tup_deleted|pg_stat_database_tup_fetched|pg_stat_database_tup_inserted|pg_stat_database_tup_returned|pg_stat_database_tup_updated|pg_stat_database_xact_commit|pg_stat_database_xact_rollback|pg_stat_statements_block_read_seconds_total|pg_stat_statements_block_write_seconds_total|pg_stat_statements_calls_total|pg_stat_statements_rows_total|pg_stat_statements_seconds_total|pg_stat_user_tables_analyze_count|pg_stat_user_tables_autoanalyze_count|pg_stat_user_tables_autovacuum_count|pg_stat_user_tables_idx_scan|pg_stat_user_tables_idx_tup_fetch|pg_stat_user_tables_index_size_bytes|pg_stat_user_tables_last_analyze|pg_stat_user_tables_last_autoanalyze|pg_stat_user_tables_last_autovacuum|pg_stat_user_tables_last_vacuum|pg_stat_user_tables_n_dead_tup|pg_stat_user_tables_n_live_tup|pg_stat_user_tables_n_mod_since_analyze|pg_stat_user_tables_seq_scan|pg_stat_user_tables_seq_tup_read|pg_stat_user_tables_table_size_bytes|pg_stat_user_tables_vacuum_count|pg_statio_user_indexes_idx_blks_hit_total|pg_statio_user_indexes_idx_blks_read_total|pg_statio_user_tables_heap_blocks_hit|pg_statio_user_tables_heap_blocks_read|pg_statio_user_tables_idx_blocks_hit|pg_statio_user_tables_idx_blocks_read|pg_statio_user_tables_tidx_blocks_hit|pg_statio_user_tables_tidx_blocks_read|pg_statio_user_tables_toast_blocks_hit|pg_statio_user_tables_toast_blocks_read|pg_wal_segments|pg_wal_size_bytes'
        action: keep
      - source_labels: [__name__, datname]
        regex: '.+;(agentg)?'
        action: keep
