receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  otlp_http/victoria_metrics:
    metrics_endpoint: http://victoria-metrics:8428/opentelemetry/v1/metrics
  otlp_http/jaeger:
    traces_endpoint: http://jaeger:4318/v1/traces

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/victoria_metrics]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/jaeger]
